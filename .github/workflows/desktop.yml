name: Desktop apps
on:
  push:
    tags: ['v*']
    branches: ['main']
    paths: ['tools/clock_setup/**', 'firmware/**', 'tests/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows-x64
          - os: macos-15
            label: macOS-arm64
          - os: macos-15-intel
            label: macOS-x64
          - os: ubuntu-22.04
            label: Linux-x64
    runs-on: ${{ matrix.os }}
    env:
      CAN_SIGN_MAC: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.MACOS_SIGNING_IDENTITY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/clock_setup/requirements.txt pyinstaller==6.22.0
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - run: python -m unittest discover -s tests -p 'test_*.py'
        env:
          QT_QPA_PLATFORM: offscreen
      - run: node tests/web_serial_test.js
      - run: node tests/calibration_ui_test.js
      - name: Configure signed macOS release
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v') && env.CAN_SIGN_MAC == 'true'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: python tools/clock_setup/configure_macos_ci.py
      - name: Explain deferred macOS downloads
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v') && env.CAN_SIGN_MAC != 'true'
        run: echo '::notice::macOS release downloads omitted because signing credentials are unavailable. Upload a locally signed and notarized build after Apple accepts it.'
      - run: python tools/clock_setup/build_app.py
        if: "!(runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v') && env.CAN_SIGN_MAC != 'true')"
      - run: python tools/clock_setup/smoke_app.py
        if: "!(runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v') && env.CAN_SIGN_MAC != 'true')"
      - uses: actions/upload-artifact@v4
        if: "!(runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v') && env.CAN_SIGN_MAC != 'true')"
        with:
          name: clock-setup-${{ matrix.label }}
          path: |
            dist-clock/*.zip
            dist-clock/*.tar.gz
          if-no-files-found: error
  firmware-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: c++ -std=c++17 -Wall -Wextra -Itests tests/firmware_test.cpp -o /tmp/firmware-test && /tmp/firmware-test
      - run: c++ -std=c++17 -Wall -Wextra -Itests tests/firmware_r4_test.cpp -o /tmp/firmware-r4-test && /tmp/firmware-r4-test
      - run: c++ -std=c++17 -Wall -Wextra -Itests tests/firmware_timezone_test.cpp -o /tmp/timezone-test && /tmp/timezone-test
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, firmware-tests]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: clock-setup-*
          path: downloads
          merge-multiple: true
      - name: Publish downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd downloads
          sha256sum * > SHA256SUMS.txt
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [ -f "../release-notes/$TAG.md" ]; then
              gh release create "$TAG" --verify-tag --title "Clock Setup $TAG" --notes-file "../release-notes/$TAG.md"
            else
              gh release create "$TAG" --verify-tag --title "Clock Setup $TAG" --generate-notes
            fi
          fi
          gh release upload "$TAG" ./* --clobber
